name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & headless test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: as --version | head -1 && ld --version | head -1

      - name: Build (release)
        run: ./build.sh release

      - name: Binary policy checks
        run: ci/check-binary.sh build/beemodel

      - name: Self-test (allocators, job system, benchmark)
        run: |
          ./build/beemodel --selftest
          BEEMODEL_THREADS=0 ./build/beemodel --selftest
          BEEMODEL_THREADS=3 ./build/beemodel --selftest

      - name: Build (debug, with symbols)
        run: ./build.sh debug && ./build.sh release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --quiet pillow
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core >/dev/null

      - name: Boolean stress corpus (exact identities, closed results)
        run: timeout 300 python tests/bool_stress.py build/beemodel --cases 300

      - name: Image readers and writers (PNG, JPEG, HDR, EXR)
        run: timeout 300 python tests/image_io.py build/beemodel

      - name: Install the 3MF checkers (lib3mf, PrusaSlicer)
        run: |
          python -m pip install --quiet lib3mf
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends prusa-slicer xvfb >/dev/null

      - name: Enclosure walkthrough (3MF read by lib3mf, sliced by PrusaSlicer)
        run: timeout 600 python tests/enclosure.py build/beemodel --require-lib3mf --require-slicer

      - name: Sculpt and paint walkthrough (sculpt, bake, paint layers, vertex colours, .bee)
        run: timeout 300 python tests/sculpt_paint.py build/beemodel build/shots

      - name: Procedural walkthrough (terrain, scattering, a million instances)
        run: timeout 300 python tests/procedural.py build/beemodel build/shots

      - name: Animation walkthrough (a rigged walk, a mechanism, 1000 bodies, cloth, a bake)
        run: timeout 300 python tests/animation.py build/beemodel build/shots

      - name: Sculpting at scale (25M vertices, frame times, memory)
        run: timeout 900 python tests/sculpt20m.py build/beemodel --frame-ms 250

      - name: A billion triangles (virtual geometry: cuts, culling, streaming, memory)
        run: timeout 900 python tests/billion.py build/beemodel build/shots --tiles 4 --frame-ms 150

      - name: Headless UI test (fake Wayland compositor, TrueType fonts)
        run: timeout 600 python tools/fakewl.py build/shots

      - name: Headless UI test (bitmap font fallback + golden images)
        env:
          BEEMODEL_FONT: none
          BEEMODEL_MONO_FONT: none
          BEEMODEL_GOLDEN: check
        run: timeout 600 python tools/fakewl.py build/shots-bitmap

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            build/shots/
            build/shots-bitmap/
          if-no-files-found: ignore
