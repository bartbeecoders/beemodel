name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & headless test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: as --version | head -1 && ld --version | head -1

      - name: Vulkan loader and llvmpipe (for the GPU helper)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Build (release)
        run: scripts/build.sh release && test -x build/beemodel-gpu

      - name: Binary policy checks
        run: ci/check-binary.sh build/beemodel

      - name: Windows build checks (beemodel.exe under Wine)
        run: |
          sudo apt-get install -y --no-install-recommends wine wine64
          ci/check-exe.sh build/beemodel.exe

      - name: Self-test (allocators, job system, benchmark)
        run: |
          ./build/beemodel --selftest
          BEEMODEL_THREADS=0 ./build/beemodel --selftest
          BEEMODEL_THREADS=3 ./build/beemodel --selftest

      - name: Build (debug, with symbols)
        run: scripts/build.sh debug && scripts/build.sh release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --quiet pillow
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core >/dev/null

      - name: BeeScript frozen for 1.x (50 agent tasks)
        run: timeout 300 python tests/beescript.py build/beemodel

      - name: Files from 1.0 open as they were (tests/fixtures/compat)
        run: timeout 300 python tests/compat.py build/beemodel

      - name: Boolean stress corpus (exact identities, closed results)
        run: timeout 300 python tests/bool_stress.py build/beemodel --cases 300

      - name: Image readers and writers (PNG, JPEG, HDR, EXR)
        run: timeout 300 python tests/image_io.py build/beemodel

      - name: Install the 3MF checkers (lib3mf, PrusaSlicer)
        run: |
          python -m pip install --quiet lib3mf
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends prusa-slicer xvfb >/dev/null

      - name: Enclosure walkthrough (3MF read by lib3mf, sliced by PrusaSlicer)
        run: timeout 600 python tests/enclosure.py build/beemodel --require-lib3mf --require-slicer

      - name: Sculpt and paint walkthrough (sculpt, bake, paint layers, vertex colours, .bee)
        run: timeout 300 python tests/sculpt_paint.py build/beemodel build/shots

      - name: Procedural walkthrough (terrain, scattering, a million instances)
        run: timeout 300 python tests/procedural.py build/beemodel build/shots

      - name: Animation walkthrough (a rigged walk, a mechanism, 1000 bodies, cloth, a bake)
        run: timeout 300 python tests/animation.py build/beemodel build/shots

      - name: Sculpting at scale (25M vertices, frame times, memory)
        run: timeout 900 python tests/sculpt20m.py build/beemodel --frame-ms 250

      - name: A billion triangles (virtual geometry - cuts, culling, streaming, memory)
        run: timeout 900 python tests/billion.py build/beemodel build/shots --tiles 4 --frame-ms 150

      - name: A world in cells (world partition - streaming, edits, budget)
        run: timeout 300 python tests/world.py build/beemodel build/shots --frame-ms 50

      - name: The content library (assets by hash, thumbnails, packs, drag and drop, MCP)
        run: timeout 300 python tests/library.py build/beemodel build/shots

      - name: Play mode (walk, fly, captured mouse, keep or discard, MCP)
        run: timeout 300 python tests/play.py build/beemodel build/shots

      - name: Logic graphs (events, actions, data nodes in play mode; door, pickup, platform)
        run: timeout 300 python tests/logic.py build/beemodel build/shots
      - name: Rigid-body solver (stacks)
        run: timeout 600 python tests/solver.py build/beemodel
      - name: Ground and landscape
        run: timeout 600 python tests/landscape.py build/beemodel
      - name: Shatter
        run: timeout 600 python tests/shatter.py build/beemodel
      - name: Attractors and force fields
        run: timeout 600 python tests/fields.py build/beemodel
      - name: Particles and liquid
        run: timeout 1200 python tests/particles.py build/beemodel
      - name: Viewport with big meshes (Material Preview, huge arrays)
        run: timeout 600 python tests/viewport.py build/beemodel

      - name: Lighting tools (light probes, lightmaps, glTF through the Khronos validator)
        run: timeout 600 python tests/lighting.py build/beemodel build/shots

      - name: Materials walkthrough (texture sets, presets, instances, functions, baking, glTF maps)
        run: timeout 600 python tests/materials.py build/beemodel build/shots

      - name: AI Assistant (stand-in Claude Code and Grok, a localhost OpenRouter; no network)
        run: timeout 300 python tests/ai.py build/beemodel build/shots

      - name: Ask AI about the selection (the box, the context sent, Only the selection; a stand-in Claude Code)
        run: timeout 300 python tests/askai.py build/beemodel build/shots

      - name: Reference images from a folder of drawings (PDF pages through poppler, sorted, true scale)
        run: |
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 poppler-utils >/dev/null
          timeout 300 python tests/refs.py build/beemodel build/shots

      - name: The published MCP tool schema (docs/mcp-tools.json)
        run: timeout 300 python tests/mcp_schema.py build/beemodel

      - name: Blender files (fixtures from Blender 5.2 and 4.2; no Blender needed)
        run: timeout 300 python tests/blend.py build/beemodel build/shots

      - name: Live link (the scene over a socket, a mirror, backpressure)
        run: timeout 300 python tests/livelink.py build/beemodel build/shots

      - name: Versioned scenes (commits, branches, the visual diff, three-way merge)
        run: timeout 300 python tests/versions.py build/beemodel build/shots

      - name: Co-editing (two users and an agent converge under fuzzed concurrent edits)
        run: timeout 900 python tests/coedit.py build/beemodel build/shots

      - name: B-rep kernel (NURBS, exact solids, booleans, fillets, the enclosure on the kernel)
        run: timeout 600 python tests/brep.py build/beemodel

      - name: Light assemblies (mates, a mechanism joint)
        run: timeout 300 python tests/assembly.py build/beemodel

      - name: 3D text (TrueType and block-font solids, lines, alignment, files, reveal)
        run: timeout 300 python tests/text.py build/beemodel

      - name: Render to video (ffmpeg, animated PNG, the menu, Esc)
        run: |
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 ffmpeg >/dev/null || echo "no ffmpeg: its checks are skipped"
          timeout 300 python tests/video.py build/beemodel build/shots

      - name: FreeCAD, else OpenCASCADE (for the STEP round trips)
        run: |
          # FreeCAD from its PPA; when Launchpad is down (503s, time-outs), the
          # OpenCASCADE bindings FreeCAD is built on (tests/step.py takes either)
          if sudo add-apt-repository -y ppa:freecad-maintainers/freecad-stable && sudo apt-get update; then
            for try in 1 2 3; do
              sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 freecad && break
              sleep 60
            done
          fi
          if command -v freecadcmd; then
            freecadcmd --version
          else
            sudo add-apt-repository -y -r ppa:freecad-maintainers/freecad-stable || true
            python -m pip install --quiet cadquery-ocp==8.0.1.1.0
            python -c "import OCP; print('OpenCASCADE (OCP) instead of FreeCAD')"
          fi

      - name: STEP (assemblies, units, colours; round trips through FreeCAD or OpenCASCADE)
        run: timeout 900 python tests/step.py build/beemodel

      - name: GPU helper (Vulkan on llvmpipe, CPU fallback, the same images)
        env:
          BEEMODEL_GPU: any
        run: timeout 2400 python -u tests/gpu.py build/beemodel build/shots --require   # (llvmpipe; 5.5 min on 4 local cores)

      - name: Headless UI test (fake Wayland compositor, TrueType fonts)
        run: timeout 1200 python tools/fakewl.py build/shots

      - name: Headless UI test (bitmap font fallback + golden images)
        env:
          BEEMODEL_FONT: none
          BEEMODEL_MONO_FONT: none
          BEEMODEL_GOLDEN: check
        run: timeout 1200 python tools/fakewl.py build/shots-bitmap

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            build/shots/
            build/shots-bitmap/
          if-no-files-found: ignore
