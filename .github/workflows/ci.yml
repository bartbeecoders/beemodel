name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & headless test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: as --version | head -1 && ld --version | head -1

      - name: Build (release)
        run: ./build.sh release

      - name: Binary policy checks
        run: ci/check-binary.sh build/beemodel

      - name: Build (debug, with symbols)
        run: ./build.sh debug && ./build.sh release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet pillow

      - name: Headless UI test (fake Wayland compositor)
        run: timeout 120 python tools/fakewl.py build/shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/shots/
          if-no-files-found: ignore
