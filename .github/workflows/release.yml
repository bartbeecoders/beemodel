name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:          # a dry run on any branch: builds, tests, packages, publishes nothing

permissions:
  contents: write

# The headless UI test with each font (15 min each) runs as jobs of its own,
# side by side with the build and packaging; Publish waits for all of them.
jobs:
  release:
    name: Build & test (Linux, Windows under Wine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Vulkan loader (the GPU helper links it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1

      - name: Build
        run: scripts/build.sh release && test -x build/beemodel-gpu

      - name: Binary policy checks
        run: ci/check-binary.sh build/beemodel

      - name: Windows build checks (beemodel.exe under Wine)
        run: |
          sudo apt-get install -y --no-install-recommends wine wine64
          ci/check-exe.sh build/beemodel.exe

      - name: Self-test
        run: ./build/beemodel --selftest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Boolean stress corpus
        run: timeout 300 python tests/bool_stress.py build/beemodel --cases 300

      - name: Image readers and writers
        run: |
          python -m pip install --quiet pillow
          timeout 300 python tests/image_io.py build/beemodel

      - name: Package (Linux and Windows) and the Windows kit
        run: scripts/package.sh && ci/winkit.sh

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md || { echo "no CHANGELOG entry for $VERSION"; exit 1; }
          cat dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: winkit
          path: build/winkit/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  ui:
    name: Headless UI (${{ matrix.font }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - font: truetype
          - font: bitmap
            env: BEEMODEL_FONT=none BEEMODEL_MONO_FONT=none BEEMODEL_GOLDEN=check
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan loader and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 fonts-dejavu-core

      - name: Build
        run: scripts/build.sh release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Headless UI test
        run: |
          python -m pip install --quiet pillow
          env ${{ matrix.env }} timeout 1200 python tools/fakewl.py build/shots

      - name: The release's screenshot
        if: matrix.font == 'truetype'
        uses: actions/upload-artifact@v4
        with:
          name: shot
          path: build/shots/01_initial.png

  windows:
    name: Windows
    needs: release
    uses: ./.github/workflows/windows.yml
    with:
      kit: winkit

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [release, ui, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: shot
          path: build/shots

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "BeeModel $v" \
            --notes-file dist/NOTES.md \
            dist/beemodel-*.tar.gz dist/beemodel-*.bin dist/beemodel-*.zip dist/SHA256SUMS \
            build/shots/01_initial.png
