name: Release

# A tag vX.Y.Z publishes BeeModel X.Y.Z with the notes from CHANGELOG.md. When
# the tag is on the commit the last nightly tested (nightly.yml), the files are
# that night's, checked against its SHA256SUMS: nothing is built or tested
# again. Otherwise the full suite (ci.yml) runs first, about 20 minutes. Run it
# by hand for a dry run on any branch: the full suite, nothing published.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    name: Tag, VERSION and changelog
    runs-on: ubuntu-24.04
    outputs:
      tested: ${{ steps.n.outputs.tested }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > NOTES.md
          test -s NOTES.md || { echo "no CHANGELOG entry for $VERSION"; exit 1; }
          cat NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: NOTES.md

      - name: Did the last nightly test this commit?
        id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(git rev-parse HEAD)"
          n="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$n" = "$head" ]; then
            echo "yes: publishing the nightly's files for ${head:0:7}"
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "no (nightly ${n:-none}, this ${head:0:7}): running the full suite first"
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: prep
    if: needs.prep.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [prep, tests]
    if: >-
      always() && github.event_name == 'push' && needs.prep.result == 'success' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes

      - name: The nightly's files
        if: needs.prep.outputs.tested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'beemodel-*' --pattern SHA256SUMS --pattern 01_initial.png
          mkdir -p shots && mv dist/01_initial.png shots/

      - uses: actions/download-artifact@v4
        if: needs.prep.outputs.tested != 'true'
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.prep.outputs.tested != 'true'
        with:
          name: screenshots-ui-truetype
          path: shots

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum -c SHA256SUMS)
          ls dist/beemodel-"$v"-* >/dev/null || { echo "the files are not version $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "BeeModel $v" \
            --notes-file NOTES.md \
            dist/beemodel-*.tar.gz dist/beemodel-*.bin dist/beemodel-*.zip dist/SHA256SUMS \
            shots/01_initial.png
