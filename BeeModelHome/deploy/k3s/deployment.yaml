apiVersion: apps/v1
kind: Deployment
metadata:
  name: beemodel-home
  namespace: beemodel-home
  labels: { app: beemodel-home }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: beemodel-home }
  template:
    metadata:
      labels: { app: beemodel-home }
    spec:
      imagePullSecrets:
        - name: acr-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: beecodersregistry.azurecr.io/beemodel-home:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
