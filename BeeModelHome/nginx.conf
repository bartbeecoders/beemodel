server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/atom+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; connect-src https://api.github.com; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # the pages: revalidated; the assets: long-lived (query-stamped CSS/JS, fixed media)
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location = /releases.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
    types { application/atom+xml xml; }
    include /etc/nginx/mime.types;
}
